<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio by Nan</title>
  <style>
    /* 全局样式 */
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      /* 背景微弱网格线条 */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 提示横条 */
    .edit-notice {
      position: fixed;
      top: 15px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--accent-purple);
      color: #ddd6fe;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    /* 顶部标题区 */
    header {
      text-align: center;
      margin-bottom: 50px;
      margin-top: 20px;
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
      color: var(--text-sub);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 三列布局卡片容器 */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1400px;
      width: 100%;
    }

    /* 卡片通用样式 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* 各卡片特有顶部高光发光线 */
    .card-purple:hover { box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3); }
    .card-cyan:hover { box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.3); }
    .card-green:hover { box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.3); }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    /* 图片预览容器 */
    .card-preview {
      width: 100%;
      height: 380px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background-color: rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 文本可编辑状态高亮边框 */
    [contenteditable="true"]:focus {
      outline: 2px dashed var(--accent-purple);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* 操作按钮 */
    .save-btn {
      margin-top: 40px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--accent-purple), #6366f1);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

    /* 响应式适配：移动端/平板变单列或双列 */
    @media (max-width: 1024px) {
      .portfolio-grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="edit-notice" style="display: none;">💡 提示：双击文字即可直接修改，修改后点击底部按钮可保存！</div>

  <header>
    <h1 contenteditable="false">Product Design</h1>
    <p contenteditable="false">UX Research&nbsp; |&nbsp; RAPID Prototype&nbsp; |&nbsp; AI WORKFLOW</p>
  </header>

  <main class="portfolio-grid">

    <div class="card card-purple">
      <h2 class="card-title" contenteditable="false">AI-enabled Talent Marketplace</h2>
      <div class="card-preview">
        <img src="Talent.png" alt="Q2C Talent Marketplace Preview">
      </div>
    </div>

    <div class="card card-cyan">
      <h2 class="card-title" contenteditable="false">One Tool for Project Accounting</h2>
      <div class="card-preview">
        <img src="PA.png" alt="Q2C Project Accounting Preview">
      </div>
    </div>

    <div class="card card-green">
      <h2 class="card-title" contenteditable="false">Expense Management</h2>
      <div class="card-preview">
        <img src="Expense.png" alt="Expense Management Preview">
      </div>
    </div>

  </main>

  <button class="save-btn" onclick="savePage()" style="display: none;">💾 保存文本修改</button>

<script>
  // 1. 检查网址里的编辑密钥
  const urlParams = new URLSearchParams(window.location.search);
  const isEditMode = urlParams.get('edit') === '110801';

  const notice = document.querySelector('.edit-notice');
  const saveBtn = document.querySelector('.save-btn');
  const editableElements = document.querySelectorAll('[contenteditable]');

  // GitHub 仓库配置
  const GITHUB_USER = 'nanwang128-ux';  // 你的 GitHub 用户名
  const GITHUB_REPO = 'portfolio';      // 你的仓库名称
  const FILE_PATH = 'index.html';       // 要更新的文件名

  if (isEditMode) {
    if(notice) notice.style.display = 'block';
    if(saveBtn) saveBtn.style.display = 'inline-block';
    editableElements.forEach(el => el.setAttribute('contenteditable', 'true'));
  } else {
    if(notice) notice.style.display = 'none';
    if(saveBtn) saveBtn.style.display = 'none';
    editableElements.forEach(el => el.setAttribute('contenteditable', 'false'));
  }

  // 点击保存时，直接调用 API 更新 GitHub 仓库
  async function savePage() {
    // 提示输入 GitHub Token
    let token = localStorage.getItem('gh_token');
    if (!token) {
      token = prompt('请输入你的 GitHub Personal Access Token (第一次输入后会自动记住):');
      if (!token) return alert('未提供 Token，无法保存到 GitHub！');
      localStorage.setItem('gh_token', token);
    }

    saveBtn.innerText = '⏳ 正在同步更新到 GitHub...';
    saveBtn.disabled = true;

    try {
      // 1. 准备只读版的 HTML 内容
      notice.style.display = 'none';
      saveBtn.style.display = 'none';
      editableElements.forEach(el => el.setAttribute('contenteditable', 'false'));

      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

      // 恢复页面编辑状态
      notice.style.display = 'block';
      saveBtn.style.display = 'inline-block';
      editableElements.forEach(el => el.setAttribute('contenteditable', 'true'));

      // 2. 获取 GitHub 上当前文件的 SHA 校验码
      const getFileUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
      const fileRes = await fetch(getFileUrl, {
        headers: { 'Authorization': `token ${token}` }
      });
      
      if (!fileRes.ok) throw new Error('读取 GitHub 文件失败，请检查 Token 权限或仓库路径！');
      const fileData = await fileRes.json();
      const sha = fileData.sha;

      // 3. 将 HTML 转换为 UTF-8 Base64 编码
      const encodedContent = btoa(unescape(encodeURIComponent(htmlContent)));

      // 4. 调用 API 提交覆盖文件
      const updateRes = await fetch(getFileUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update portfolio text via web editor',
          content: encodedContent,
          sha: sha
        })
      });

      if (updateRes.ok) {
        alert('🎉 成功更新到 GitHub！等待 1-2 分钟刷新线上网址即可看到最新效果。');
      } else {
        const errorData = await updateRes.json();
        alert('❌ 更新失败: ' + (errorData.message || '权限不足'));
        localStorage.removeItem('gh_token'); // 出错时清除可能无效的 token
      }
    } catch (err) {
      alert('网络或提交错误: ' + err.message);
    } finally {
      saveBtn.innerText = '💾 保存修改到 GitHub';
      saveBtn.disabled = false;
    }
  }
</script>

</body></html>
